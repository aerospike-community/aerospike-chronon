# Aerospike TLS test fixture configuration (Enterprise Edition eval image).
# Mounted over /etc/aerospike/aerospike.template.conf; the entrypoint
# bash-evaluates the template into aerospike.conf (static content passes
# through unchanged). The eval feature key is baked into the image at
# /etc/aerospike/features.conf — no separate mount needed.

service {
  feature-key-file /etc/aerospike/features.conf
  cluster-name chronon-tls
  node-id 1
  proto-fd-max 15000
}

logging {
  console {
    context any info
  }
}

# Enables authentication/RBAC — required for PKI certificate auth.
security {
}

network {
  service {
    address any
    port 3000
    tls-address any
    tls-port 4333
    tls-name aerospike-tls
    # with `security {}` enabled the server requests a client certificate by
    # default; set false so plain-TLS (server-auth only) tests can connect
    tls-authenticate-client false
  }

  tls aerospike-tls {
    cert-file /opt/aerospike/certs/server.crt
    key-file /opt/aerospike/certs/server.key
    ca-file /opt/aerospike/certs/ca.crt
  }

  heartbeat {
    mode mesh
    address local
    port 3002
    interval 150
    timeout 10
  }

  fabric {
    address local
    port 3001
  }
}

namespace test {
  replication-factor 1
  default-ttl 0
  nsup-period 1

  storage-engine memory {
    data-size 512M
  }
}
