name: aerospike-chronon-it

networks:
  default:
    # Pinned so the IT rig's lifecycle only ever touches its own resources,
    # never other Docker projects on the machine.
    name: aerospike-chronon-it

services:
  aerospike:
    # Pinned for reproducibility — the env-var config template (NSUP_PERIOD
    # substitution) is image-version-specific; a mounted aerospike.conf does NOT
    # work because the entrypoint regenerates it unconditionally.
    image: aerospike/aerospike-server:8.1.2.5
    container_name: aerospike-chronon-test
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    environment:
      NAMESPACE: test
      # small nsup period so TTL tests observe expiry quickly
      NSUP_PERIOD: "2"
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Section 10 (comment 9): a namespace with the supervisor disabled, for the
  # nsup fail-fast ITs. Profile-gated so `docker compose up` does not start it;
  # AerospikeDockerSpec.withNsup0Server brings it up for one test and removes it.
  aerospike-nosup:
    image: aerospike/aerospike-server:8.1.2.5
    container_name: aerospike-chronon-test-nosup
    profiles: ["nsup0"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NAMESPACE: test
      NSUP_PERIOD: "0"
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Opt-in TLS fixtures: Enterprise Edition eval image (single-node feature
  # key baked in). TLS requires EE, so these stay profile-gated — CE users
  # never start them. Run `docker/gen-tls-certs.sh` once first; the ITs do so
  # automatically. Tested image: aerospike/aerospike-server-enterprise:8.2.0.1
  # (override with AEROSPIKE_TLS_IMAGE).
  aerospike-tls:
    image: ${AEROSPIKE_TLS_IMAGE:-aerospike/aerospike-server-enterprise:8.2.0.1}
    container_name: aerospike-chronon-test-tls
    profiles: ["tls"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4533:4333"
    volumes:
      - ./docker/aerospike-tls.conf:/etc/aerospike/aerospike.template.conf:ro
      - ./docker/tls-certs:/opt/aerospike/certs:ro
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status", "-Uadmin", "-Padmin"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Same fixture with tls-authenticate-client any — mTLS-required tests.
  aerospike-tls-mtls:
    image: ${AEROSPIKE_TLS_IMAGE:-aerospike/aerospike-server-enterprise:8.2.0.1}
    container_name: aerospike-chronon-test-tls-mtls
    profiles: ["tls"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4534:4333"
    volumes:
      - ./docker/aerospike-tls-mtls.conf:/etc/aerospike/aerospike.template.conf:ro
      - ./docker/tls-certs:/opt/aerospike/certs:ro
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status", "-Uadmin", "-Padmin"]
      interval: 2s
      timeout: 3s
      retries: 30
